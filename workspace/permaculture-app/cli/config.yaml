# ============================================================
# Permaculture Sketch Enhancer — Configuration
# ============================================================
# Edit this file to tune prompts, models, and generation
# parameters without touching any Python code.
# ============================================================

model:
  # HuggingFace checkpoint ID (auto-downloaded on first run)
  # SD1.5-based options:
  #   Lykon/dreamshaper-8          — concept art / illustration (recommended)
  #   runwayml/stable-diffusion-v1-5  — vanilla SD1.5 baseline
  #   prompthero/openjourney-v4    — Midjourney-style
  checkpoint: "Lykon/dreamshaper-8"

controlnet:
  # Preprocessor applied to the input sketch before ControlNet
  #   lineart      — clean architectural lines (recommended for sketches)
  #   scribble_hed — loose/rough scribbles
  preprocessor: "lineart"

  # ControlNet conditioning strength
  #   0.0 = ignore the sketch entirely
  #   0.5 = loose guidance
  #   0.75 = balanced (default)
  #   1.0 = strict adherence to sketch lines
  strength: 0.75

prompt:
  positive: >-
    aerial permaculture farm concept art,
    watercolor wash illustration, architectural sketch style,
    warm earth tones, lush greens, professional landscape design,
    food forest canopy layers, swales and berms, keyline water channels,
    companion planting beds, natural building materials,
    high detail, sharp focus, masterpiece quality

  negative: >-
    low quality, blurry, distorted, deformed, ugly, noise,
    oversaturated, photographic, 3d render, cartoon, anime,
    text, watermark, signature, frame, border,
    extra limbs, extra fingers, mutated, disfigured

generation:
  # Inference steps (more = higher quality but slower)
  #   20  — fast draft
  #   30  — good balance (default)
  #   50  — maximum quality
  steps: 30

  # Classifier-free guidance scale
  #   5.0  — creative / loose
  #   7.5  — balanced (default)
  #   12.0 — strict prompt adherence
  guidance_scale: 7.5

  # Output resolution (must be multiples of 8)
  width: 768
  height: 768

  # Random seed (-1 = random each run, or set a fixed integer for reproducibility)
  seed: -1
